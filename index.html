<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copilot Tools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0078d4, #106ebe);
      color: #fff;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 0.5rem;
      font-size: 1rem;
      opacity: 0.88;
    }

    main {
      max-width: 960px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 1.25rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border: 1px solid #e8ecf0;
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,120,212,0.12);
      border-color: #0078d4;
    }

    .card-icon {
      font-size: 2rem;
      line-height: 1;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #0078d4;
    }

    .card-desc {
      font-size: 0.875rem;
      color: #666;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
      background: #e3f2fd;
      color: #0078d4;
      align-self: flex-start;
      margin-top: auto;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge.new {
      background: #e8f5e9;
      color: #2e7d32;
    }

    footer {
      text-align: center;
      padding: 2rem 1.5rem;
      color: #999;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<header>
  <h1>&#128640; Copilot Tools</h1>
  <p>Microsoft 365 productivity tools powered by AI</p>
</header>

<main>
  <p class="section-title">Available Tools</p>

  <div class="card-grid">

    <a href="meeting-sentiment-analysis.html" class="card">
      <div class="card-icon">&#128200;</div>
      <div class="card-title">Meeting Sentiment Analysis</div>
      <div class="card-desc">
        Analyze Teams meeting transcripts for sentiment, engagement, and team dynamics. Powered by Claude AI with keyword fallback.
      </div>
      <span class="badge new">New</span>
    </a>

  </div>
</main>

<footer>
  &copy; 2026 Copilot Tools &mdash; Microsoft 365 + Claude AI
</footer>

</body>
</html>
